name: Daily forward validation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: write

jobs:
  update-forward-log:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tracker dependencies
        run: python -m pip install -r requirements-tracker.txt

      - name: Run daily forward tracker and notification engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python forward_tracker.py

      - name: Commit forward and notification logs when changed
        shell: bash
        run: |
          if git diff --quiet -- data/forward_signals.csv data/notification_events.csv; then
            echo "No tracked-data change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forward_signals.csv data/notification_events.csv
          git commit -m "chore: update forward validation and notification logs"
          git push
